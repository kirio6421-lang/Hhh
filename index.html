<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отдай чекушку</title>
<style>
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: Arial, sans-serif; }
  #hud {
    position: absolute; top: 20px; left: 20px; color: white;
    font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000;
    pointer-events: none;
  }
  #gameover {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85); color: white; padding: 40px 60px;
    border-radius: 20px; text-align: center; display: none;
    border: 4px solid #ff3333;
  }
  #gameover h1 { margin: 0 0 10px 0; color: #ff3333; font-size: 42px; }
  #gameover p { margin: 5px 0; font-size: 20px; }
  #gameover button {
    margin-top: 20px; padding: 12px 30px; font-size: 18px;
    background: #ffcc00; border: none; border-radius: 10px;
    cursor: pointer; font-weight: bold;
  }
  #start {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8); color: white; padding: 40px 60px;
    border-radius: 20px; text-align: center; border: 4px solid #ffcc00;
  }
  #start h1 { margin: 0 0 10px 0; color: #ffcc00; }
  #start button {
    margin-top: 20px; padding: 12px 30px; font-size: 18px;
    background: #ffcc00; border: none; border-radius: 10px;
    cursor: pointer; font-weight: bold;
  }
</style>
</head>
<body>

<div id="hud">🏃 Дистанция: <span id="dist">0</span> м</div>

<div id="start">
  <h1>ОТДАЙ ЧЕКУШКУ!</h1>
  <p>Свайпы: ← → полосы, ↑ прыжок, ↓ подкат</p>
  <button onclick="startGame()">НАЧАТЬ ПОБЕГ</button>
</div>

<div id="gameover">
  <h1>СОБАКА ДОГНАЛА!</h1>
  <p>Дистанция: <span id="finalDist">0</span> м</p>
  <p>Чекушка потеряна... 🍾</p>
  <button onclick="restart()">ЕЩЁ РАЗ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ СЦЕНА ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb8d3);
scene.fog = new THREE.Fog(0x9bb8d3, 20, 90);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 5, 9);
camera.lookAt(0, 2, -10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Свет
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 20, 10);
scene.add(sun);

// ============ ЗЕМЛЯ ============
const roadGeo = new THREE.PlaneGeometry(20, 400);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI/2;
road.position.z = -150;
scene.add(road);

// Разметка
for (let i = 0; i < 100; i++) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.3, 3),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  line.rotation.x = -Math.PI/2;
  line.position.set(3.3, 0.01, -i * 8);
  scene.add(line);
  const line2 = line.clone();
  line2.position.x = -3.3;
  scene.add(line2);
}

// Дома по бокам
for (let i = 0; i < 40; i++) {
  const side = i % 2 === 0 ? 1 : -1;
  const building = new THREE.Mesh(
    new THREE.BoxGeometry(6, 8 + Math.random()*6, 6),
    new THREE.MeshStandardMaterial({ color: side > 0 ? 0x8899aa : 0xaa8899 })
  );
  building.position.set(side * 10, building.geometry.parameters.height/2, -i * 12 - 10);
  scene.add(building);
}

// ============ ГЕРОЙ (Мужик) ============
const player = new THREE.Group();
// Тело
const body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.7, 0.8, 1.4, 8),
  new THREE.MeshStandardMaterial({ color: 0xffffff }) // белая майка
);
body.position.y = 1.4;
player.add(body);
// Шорты
const shorts = new THREE.Mesh(
  new THREE.CylinderGeometry(0.8, 0.8, 0.8, 8),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
shorts.position.y = 0.5;
player.add(shorts);
// Голова
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.45, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffcc99 })
);
head.position.y = 2.4;
player.add(head);
// Ноги (для анимации бега)
const legGeo = new THREE.CylinderGeometry(0.18, 0.15, 1, 6);
const legMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
const leftLeg = new THREE.Mesh(legGeo, legMat);
leftLeg.position.set(-0.3, 0.3, 0);
player.add(leftLeg);
const rightLeg = new THREE.Mesh(legGeo, legMat);
rightLeg.position.set(0.3, 0.3, 0);
player.add(rightLeg);
player.legs = [leftLeg, rightLeg];
scene.add(player);

// ============ СОБАКА (преследователь) ============
const dog = new THREE.Group();
const dogBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.7, 0.5, 1.2),
  new THREE.MeshStandardMaterial({ color: 0xcc7722 })
);
dogBody.position.y = 0.6;
dog.add(dogBody);
const dogHead = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.5, 0.5),
  new THREE.MeshStandardMaterial({ color: 0xcc7722 })
);
dogHead.position.set(0, 0.9, 0.7);
dog.add(dogHead);
// Ноги собаки
const dogLegGeo = new THREE.BoxGeometry(0.15, 0.5, 0.15);
const dogLegMat = new THREE.MeshStandardMaterial({ color: 0xaa5522 });
const dogLegs = [];
[[-0.25, 0.3], [0.25, 0.3], [-0.25, -0.3], [0.25, -0.3]].forEach(p => {
  const l = new THREE.Mesh(dogLegGeo, dogLegMat);
  l.position.set(p[0], 0.25, p[1]);
  dog.add(l);
  dogLegs.push(l);
});
dog.legs = dogLegs;
dog.position.set(0, 0, 6);
scene.add(dog);

// ============ ПРЕПЯТСТВИЯ ============
const obstacles = [];
const OBSTACLE_COLORS = [0xcc2222, 0x222222, 0xffcc00];

function spawnObstacle(z, lane) {
  const type = Math.random();
  let mesh;
  let isLow = false;

  if (type < 0.4) {
    // Шлагбаум (низкий, надо подкатываться)
    mesh = new THREE.Mesh(
      new THREE.BoxGeometry(2.5, 0.3, 0.3),
      new THREE.MeshStandardMaterial({ color: 0xff3333 })
    );
    mesh.position.y = 0.8;
    isLow = true;
  } else if (type < 0.75) {
    // Бетонный блок (надо прыгать)
    mesh = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 1.2, 0.8),
      new THREE.MeshStandardMaterial({ color: 0x999999 })
    );
    mesh.position.y = 0.6;
  } else {
    // Высокий столб (объезжать)
    mesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 3, 0.8),
      new THREE.MeshStandardMaterial({ color: 0x555555 })
    );
    mesh.position.y = 1.5;
  }

  mesh.position.x = lane * 3.3;
  mesh.position.z = z;
  mesh.userData = { lane, isLow, type: mesh.position.y };
  scene.add(mesh);
  obstacles.push(mesh);
}

// ============ СОСТОЯНИЕ ИГРЫ ============
const LANES = [-1, 0, 1];
let state = {
  lane: 1,           // 0, 1, 2 (индекс)
  x: 0,
  targetX: 0,
  y: 0,
  vy: 0,
  jumping: false,
  sliding: false,
  slideTimer: 0,
  speed: 0.45,
  distance: 0,
  running: false,
  dogDistance: 6,
  obstacleTimer: 0,
  spawnInterval: 25,
  gameOver: false
};

const keys = {};
addEventListener('keydown', e => { keys[e.key] = true; handleInput(e.key); });
addEventListener('keyup', e => { keys[e.key] = false; });

// Мобильные свайпы
let touchStart = null;
addEventListener('touchstart', e => { touchStart = e.touches[0]; });
addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 30) handleInput('ArrowRight');
    else if (dx < -30) handleInput('ArrowLeft');
  } else {
    if (dy > 30) handleInput('ArrowDown');
    else if (dy < -30) handleInput('ArrowUp');
  }
  touchStart = null;
});

function handleInput(key) {
  if (!state.running) return;
  if (key === 'ArrowLeft' || key === 'a') {
    state.lane = Math.max(0, state.lane - 1);
    state.targetX = LANES[state.lane] * 3.3;
  }
  if (key === 'ArrowRight' || key === 'd') {
    state.lane = Math.min(2, state.lane + 1);
    state.targetX = LANES[state.lane] * 3.3;
  }
  if ((key === 'ArrowUp' || key === 'w') && !state.jumping && !state.sliding) {
    state.jumping = true;
    state.vy = 0.28;
  }
  if (key === 'ArrowDown' || key === 's') {
    state.sliding = true;
    state.slideTimer = 30;
  }
}

// ============ СТАРТ / РЕСТАРТ ============
function startGame() {
  document.getElementById('start').style.display = 'none';
  document.getElementById('gameover').style.display = 'none';
  resetGame();
  state.running = true;
}

function restart() {
  document.getElementById('gameover').style.display = 'none';
  // Удаляем все препятствия
  obstacles.forEach(o => scene.remove(o));
  obstacles.length = 0;
  resetGame();
  state.running = true;
}

function resetGame() {
  state = {
    lane: 1, x: 0, targetX: 0,
    y: 0, vy: 0, jumping: false,
    sliding: false, slideTimer: 0,
    speed: 0.45, distance: 0,
    running: true, dogDistance: 6,
    obstacleTimer: 0, spawnInterval: 25,
    gameOver: false
  };
  player.position.set(0, 0, 0);
  dog.position.set(0, 0, 6);
  player.rotation.set(0, 0, 0);
  player.scale.set(1, 1, 1);
}

// ============ ИГРОВОЙ ЦИКЛ ============
let lastTime = performance.now();
let animTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 16.67, 2);
  lastTime = now;
  animTime += dt;

  if (state.running && !state.gameOver) {
    // Плавное перемещение по X
    state.x += (state.targetX - state.x) * 0.25 * dt;
    player.position.x = state.x;

    // Прыжок
    if (state.jumping) {
      state.y += state.vy * dt;
      state.vy -= 0.022 * dt;
      if (state.y <= 0) {
        state.y = 0;
        state.jumping = false;
        state.vy = 0;
      }
      player.position.y = state.y;
    }

    // Подкат
    if (state.sliding) {
      state.slideTimer -= dt;
      player.scale.y = 0.5;
      player.rotation.x = -0.5;
      if (state.slideTimer <= 0) {
        state.sliding = false;
        player.scale.y = 1;
        player.rotation.x = 0;
      }
    }

    // Анимация ног мужика
    const legSwing = Math.sin(animTime * 0.5) * 0.6;
    player.legs[0].rotation.x = legSwing;
    player.legs[1].rotation.x = -legSwing;

    // Дистанция
    state.distance += state.speed * dt;
    document.getElementById('dist').textContent = Math.floor(state.distance);

    // Спавн препятствий
    state.obstacleTimer += dt;
    if (state.obstacleTimer >= state.spawnInterval) {
      state.obstacleTimer = 0;
      // Спавним на случайной полосе, иногда 2 полосы
      const laneCount = Math.random() < 0.3 ? 2 : 1;
      const usedLanes = new Set();
      for (let i = 0; i < laneCount; i++) {
        let l;
        do { l = Math.floor(Math.random() * 3); } while (usedLanes.has(l));
        usedLanes.add(l);
        spawnObstacle(-100, LANES[l]);
      }
    }

    // Двигаем препятствия
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.position.z += state.speed * dt;

      // Столкновение
      if (!o.userData.hit &&
          Math.abs(o.position.z - player.position.z) < 1.2 &&
          Math.abs(o.position.x - player.position.x) < 1.5) {

        const isLow = o.userData.isLow;
        const isHigh = !isLow && o.userData.type > 1;

        // Логика уклонения
        if (isLow && state.sliding) { /* ок */ }
        else if (isHigh && state.y > 1.2) { /* ок */ }
        else if (!isLow && !isHigh && state.y > 0.3) { /* перепрыгнул */ }
        else {
          // Врезался!
          o.userData.hit = true;
          state.dogDistance -= 1.5;
          // Красная вспышка
          renderer.domElement.style.filter = 'hue-rotate(-40deg)';
          setTimeout(() => renderer.domElement.style.filter = '', 150);
        }
      }

      // Убираем за спиной
      if (o.position.z > 15) {
        scene.remove(o);
        obstacles.splice(i, 1);
      }
    }

    // Собака догоняет
    if (state.dogDistance > 2) {
      state.dogDistance -= 0.003 * dt;
    }
    // Собака визуально
    dog.position.z = player.position.z + state.dogDistance;
    dog.position.x = player.position.x;
    // Анимация ног собаки
    dog.legs.forEach((l, i) => {
      l.rotation.x = Math.sin(animTime * 0.8 + i) * 0.5;
    });

    // Поражение
    if (state.dogDistance <= 2.2) {
      state.gameOver = true;
      state.running = false;
      document.getElementById('finalDist').textContent = Math.floor(state.distance);
      document.getElementById('gameover').style.display = 'block';
    }

    // Ускорение со временем
    if (state.speed < 1.2) state.speed += 0.0001 * dt;
    if (state.spawnInterval > 12) state.spawnInterval -= 0.002 * dt;
  }

  // Камера следует
  camera.position.x += (player.position.x * 0.5 - camera.position.x) * 0.05;
  camera.lookAt(player.position.x * 0.5, 2, -10);

  renderer.render(scene, camera);
}

// Ресайз
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
